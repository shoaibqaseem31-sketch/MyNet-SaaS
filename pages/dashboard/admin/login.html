
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyNet ISP Admin Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "#faf8ff",
            primary: "#004ac6",
            "primary-container": "#2563eb",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f3ff",
            "on-surface": "#131b2e",
            "on-surface-variant": "#434655",
            outline: "#737686",
            "outline-variant": "#c3c6d7"
          },
          fontFamily: {
            display: ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-full bg-background text-on-surface antialiased font-display">
  <header class="border-b border-outline-variant/40 bg-white shadow-sm">
    <div class="mx-auto flex max-w-7xl items-center gap-3 px-6 py-4">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-primary to-primary-container text-white shadow-sm">
        <span class="material-symbols-outlined">wifi_tethering</span>
      </div>
      <div>
        <div class="text-xl font-extrabold tracking-tight text-primary">MyNet</div>
        <div class="text-[10px] font-bold uppercase tracking-wider text-outline">
          Internet Service Provider
        </div>
      </div>
    </div>
  </header>

  <main class="flex min-h-[calc(100vh-150px)] items-center justify-center px-4 py-12">
    <section class="w-full max-w-md overflow-hidden rounded-2xl border border-outline-variant/40 bg-white shadow-sm">
      <div class="h-1.5 bg-gradient-to-r from-primary to-primary-container"></div>

      <div class="p-7 sm:p-9">
        <div class="mb-6 flex h-14 w-14 items-center justify-center rounded-xl bg-[#dbe1ff] text-primary">
          <span class="material-symbols-outlined text-3xl">admin_panel_settings</span>
        </div>

        <div class="mb-2 inline-flex rounded-full border border-[#b4c5ff] bg-[#dbe1ff] px-3 py-1 text-xs font-bold text-[#00174b]">
          Admin Portal
        </div>

        <h1 class="mt-3 text-2xl font-bold tracking-tight">Welcome Back</h1>
        <p class="mt-2 text-sm leading-6 text-on-surface-variant">
          Sign in to manage your subscribers, packages and payment records.
        </p>

        <form id="adminLoginForm" class="mt-7 space-y-5">
          <div>
            <label for="email" class="mb-2 block text-sm font-semibold">
              Admin Email
            </label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              required
              placeholder="Enter your admin email"
              class="w-full rounded-lg border border-outline-variant bg-white px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
            >
          </div>

          <div>
            <label for="password" class="mb-2 block text-sm font-semibold">
              Password
            </label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Enter your password"
              class="w-full rounded-lg border border-outline-variant bg-white px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
            >
          </div>

          <button
            type="submit"
            class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary px-5 py-3.5 text-sm font-bold text-white shadow-sm transition hover:bg-primary-container"
          >
            <span>Sign In to Admin Portal</span>
            <span class="material-symbols-outlined text-lg">arrow_forward</span>
          </button>

          <p id="loginMessage" class="hidden text-sm" role="alert"></p>
        </form>

        <div class="mt-6 flex items-start gap-2 rounded-lg border border-outline-variant/40 bg-[#f2f3ff] p-3 text-xs leading-5 text-on-surface-variant">
          <span class="material-symbols-outlined text-base text-primary">verified_user</span>
          <p>Restricted access. Only authorized MyNet administrators can sign in.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-t border-outline-variant/40 bg-white px-6 py-5 text-center text-xs text-on-surface-variant">
    MyNet Internet Service Provider
  </footer>
  
<script type="module" src="./login.js"></script>
</body>
</html>
