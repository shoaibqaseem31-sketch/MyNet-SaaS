    function switchTab(tab) {
      const signinBtn = document.getElementById('tab-btn-signin');
      const registerBtn = document.getElementById('tab-btn-register');
      const signinPanel = document.getElementById('panel-signin');
      const registerPanel = document.getElementById('panel-register');

      if (tab === 'signin') {
        signinBtn.className = "py-2.5 text-center text-label-md font-label-md rounded-md bg-surface-container-lowest text-primary shadow-sm transition-all duration-150 flex items-center justify-center gap-2";
        registerBtn.className = "py-2.5 text-center text-label-md font-label-md rounded-md text-on-surface-variant hover:text-primary transition-all duration-150 flex items-center justify-center gap-2";
        signinPanel.classList.remove('hidden');
        signinPanel.classList.add('block');
        registerPanel.classList.remove('block');
        registerPanel.classList.add('hidden');
      } else {
        registerBtn.className = "py-2.5 text-center text-label-md font-label-md rounded-md bg-surface-container-lowest text-primary shadow-sm transition-all duration-150 flex items-center justify-center gap-2";

        registerPanel.classList.remove('hidden');
        registerPanel.classList.add('block');
        signinPanel.classList.remove('block');
        signinPanel.classList.add('hidden');
      }
    }

      const input = document.getElementById(fieldId);

      if (input.type === 'password') {
        input.type = 'text';
        iconSpan.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        iconSpan.textContent = 'visibility';
